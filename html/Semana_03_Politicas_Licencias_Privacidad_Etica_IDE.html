<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Material IDE — Versión ampliada</title><style>body{font-family:Arial,Helvetica,sans-serif;background:#f4f6f7;color:#19252d;margin:0;padding:2rem;line-height:1.6}main{max-width:800px;margin:auto;background:white;border:1px solid #dbe2e6;padding:2rem}h1{color:#143a51}</style></head><body><main><h1>Cargando material de la asignatura…</h1><p id="status">Se está cargando el HTML original desde el repositorio público y agregando los ejemplos prácticos sin cambiar su formato.</p></main><script>const URL="https://raw.githubusercontent.com/dhagura/Material-IDE/main/html/Semana_03_Politicas_Licencias_Privacidad_Etica_IDE.html";const EXTRA="<section id=\"talleres-adicionales-semana3\" aria-label=\"Talleres aplicados de políticas y privacidad\">\n<h2>Talleres aplicados: publicación responsable de datos geoespaciales</h2>\n<p>Los ejemplos son <strong>casos ficticios con fines educativos</strong>. Sirven para evaluar condiciones de acceso, licencias, protección de datos y posibles efectos sociales antes de publicar información en una IDE. La decisión final para un caso real debe contrastarse con las normas aplicables y las políticas de la institución.</p>\n<h3>Taller 1. Distinguir publicidad, apertura y permiso de reutilización</h3>\n<p><strong>Escenario.</strong> Un organismo ofrece visualización pública de una capa de áreas verdes, permite descargar un GeoJSON sin mostrar licencia y también administra un listado restringido de denuncias con coordenadas.</p>\n<table><thead><tr><th>Recurso</th><th>Acceso observado</th><th>Pregunta para decidir</th></tr></thead><tbody>\n<tr><td>Mapa de áreas verdes</td><td>Visualización pública</td><td>¿Está autorizada también la redistribución y adaptación?</td></tr>\n<tr><td>GeoJSON de áreas verdes</td><td>Descarga sin licencia indicada</td><td>¿Qué condiciones de reutilización constan explícitamente?</td></tr>\n<tr><td>Denuncias con ubicación detallada</td><td>Acceso restringido</td><td>¿La coordenada permite identificar personas o domicilios?</td></tr>\n</tbody></table>\n<p><strong>Cómo probarlo.</strong> Clasifique cada recurso en: visualizable, descargable, reutilizable con licencia clara o sujeto a evaluación de acceso. Justifique por qué una URL accesible no demuestra, por sí sola, una autorización amplia de reutilización.</p>\n<p><strong>Resultado esperado.</strong> Se distingue disponibilidad técnica, publicidad legal y autorización de uso. La clasificación debe quedar reflejada en metadatos y condiciones de servicio.</p>\n<h3>Taller 2. Comparar alternativas de licencia</h3>\n<p><strong>Escenario.</strong> Una IDE publicará una base municipal de ciclovías producida por la institución y otra base combinada que incorpora aportes de terceros. Antes de elegir una licencia, debe verificarse la titularidad y la compatibilidad de los materiales de origen.</p>\n<table><thead><tr><th>Alternativa</th><th>Característica general</th><th>Revisión necesaria</th></tr></thead><tbody>\n<tr><td>CC BY 4.0</td><td>Autoriza reutilización y adaptación con atribución</td><td>Derechos para licenciar y forma de atribución</td></tr>\n<tr><td>CC BY-SA 4.0</td><td>Requiere compartir adaptaciones bajo condiciones de compartir igual</td><td>Compatibilidad de contribuciones y derivados</td></tr>\n<tr><td>ODbL 1.0</td><td>Licencia específica para bases de datos con condiciones de compartir igual</td><td>Obligaciones aplicables a bases derivadas y su uso</td></tr>\n<tr><td>Sin licencia indicada</td><td>No expresa autorización abierta de reutilización</td><td>Solicitar definición antes de anunciar datos abiertos</td></tr>\n</tbody></table>\n<p><strong>Cómo probarlo.</strong> Para cada fuente, documente quién posee derechos, si hay datos de terceros, la licencia actual, la intención de reutilización y su recomendación motivada. Después redacte una ficha con nombre de licencia, versión, enlace a su texto oficial y forma de citar la fuente.</p>\n<p><strong>Resultado esperado.</strong> La elección no se determina solo por el formato GeoJSON o WMS, sino por derechos, obligaciones y posibles restricciones. <strong>Advertencia:</strong> una licencia abierta no elimina obligaciones de privacidad.</p>\n<h3>Taller 3. Medir el riesgo de divulgar ubicaciones puntuales</h3>\n<p><strong>Escenario.</strong> Un conjunto sintético contiene solicitudes ciudadanas con coordenadas y una categoría. Aunque no incluye nombres, algunas ubicaciones coinciden con domicilios. Evalúe si conviene publicar puntos precisos o estadísticas agregadas.</p>\n<pre><code>id,zona,tipo\n1,Norte,ruido\n2,Norte,ruido\n3,Norte,alumbrado\n4,Centro,ruido\n5,Centro,alumbrado\n6,Sur,ruido</code></pre>\n<p><strong>Cómo probarlo sin instalar programas adicionales.</strong> Copie la tabla en una hoja de cálculo. Cuente registros por <code>zona</code> y por <code>tipo</code>, cree una tabla dinámica y contraste la difusión de los puntos con una tabla agregada. Discuta por qué un grupo con un único registro puede ser identificable cuando se combina con otra información. Los datos no incluyen coordenadas reales y la zona es una categoría sintética.</p>\n<table><thead><tr><th>Zona</th><th>Registros</th><th>Revisión de publicación</th></tr></thead><tbody><tr><td>Norte</td><td>3</td><td>Examinar tamaño de celda y contexto</td></tr><tr><td>Centro</td><td>2</td><td>Examinar riesgo de inferencia</td></tr><tr><td>Sur</td><td>1</td><td>Evitar publicación de detalle que permita singularización</td></tr></tbody></table>\n<p><strong>Resultado esperado.</strong> La agregación puede reducir exposición, pero por sí sola no garantiza anonimato. No existe un umbral universal suficiente para todos los datos y contextos: deben evaluarse combinaciones, frecuencia y posibles cruces con otras fuentes.</p>\n<h3>Taller 4. Aplicar una matriz de decisión antes de publicar</h3>\n<p><strong>Escenario.</strong> Se solicita abrir datos de equipamientos educativos, reportes ciudadanos, límites comunales y ubicaciones de infraestructuras críticas. La decisión debe ser específica para cada conjunto.</p>\n<table><thead><tr><th>Recurso</th><th>Riesgo que debe examinarse</th><th>Medida candidata</th></tr></thead><tbody>\n<tr><td>Equipamientos públicos</td><td>Calidad, actualización, derechos sobre datos</td><td>Metadatos y licencia cuando proceda</td></tr>\n<tr><td>Reportes ciudadanos</td><td>Identificación por ubicación y atributos</td><td>Minimización, agregación o acceso diferenciado</td></tr>\n<tr><td>Límites comunales</td><td>Vigencia, fuente oficial y condiciones de uso</td><td>Publicar versión y referencia de origen</td></tr>\n<tr><td>Infraestructura crítica</td><td>Seguridad y sensibilidad operacional</td><td>Evaluación de detalle y autorización de acceso</td></tr>\n</tbody></table>\n<p><strong>Cómo probarlo.</strong> Para cada recurso complete: finalidad, base de legitimidad, fuente, riesgos, usuarios destinatarios, nivel de detalle, licencia o restricción, responsable aprobador y mecanismo de revisión. Emita una de cuatro decisiones motivadas: publicar, publicar transformado, publicar con acceso controlado o no publicar mientras persista el riesgo.</p>\n<p><strong>Resultado esperado.</strong> La resolución deja una justificación trazable y puede traducirse en requisitos técnicos de la Semana 4: autenticación, perfiles, agregación, metadatos de restricciones, bitácoras y política de conservación.</p>\n<h3>Taller 5. Ficha de metadatos de uso y privacidad</h3>\n<p><strong>Plantilla sugerida.</strong> Complete la ficha con el recurso ficticio <code>areas_verdes_2026</code> y contraste qué cambia para un recurso restringido.</p>\n<pre><code>{\n  \"identificador\": \"areas_verdes_2026\",\n  \"responsable\": \"Unidad territorial\",\n  \"fecha_actualizacion\": \"2026-10-01\",\n  \"cobertura\": \"Comunal\",\n  \"uso_previsto\": \"Consulta y análisis territorial\",\n  \"licencia\": \"Pendiente de confirmación de derechos\",\n  \"restricciones_acceso\": \"Por evaluar\",\n  \"riesgo_privacidad\": \"Por evaluar\",\n  \"contacto\": \"Contacto institucional por definir\"\n}</code></pre>\n<p><strong>Cómo probarlo.</strong> Guarde el contenido como <code>politica_recurso.json</code> y compruebe su sintaxis con <code>python -m json.tool politica_recurso.json</code>. Cambie las condiciones cuando el caso sea un conjunto con ubicaciones residenciales. Justifique qué campos deberán representarse posteriormente en metadatos normalizados y servicios. El JSON es una ficha didáctica y no reemplaza ISO 19115-1.</p>\n</section>\n";(async()=>{const status=document.getElementById('status');try{const r=await fetch(URL,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);let html=await r.text();if(!html.includes('<div class="weeknav">'))throw new Error('No se encontró la navegación original');if(html.includes('talleres-adicionales-semana'))throw new Error('El recurso ya contiene estos talleres');html=html.replace('<div class="weeknav">',EXTRA+'\n<div class="weeknav">');document.open();document.write(html);document.close()}catch(e){status.textContent='No fue posible recuperar el material original desde GitHub: '+e.message+'. Se requiere conexión a Internet. Para uso sin conexión, genera los HTML autónomos con el kit adjunto.'}})();</script></body></html>
