<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Material IDE — Versión ampliada</title><style>body{font-family:Arial,Helvetica,sans-serif;background:#f4f6f7;color:#19252d;margin:0;padding:2rem;line-height:1.6}main{max-width:800px;margin:auto;background:white;border:1px solid #dbe2e6;padding:2rem}h1{color:#143a51}</style></head><body><main><h1>Cargando material de la asignatura…</h1><p id="status">Se está cargando el HTML original desde el repositorio público y agregando los ejemplos prácticos sin cambiar su formato.</p></main><script>const URL="https://raw.githubusercontent.com/dhagura/Material-IDE/main/html/Semana_02_Gobernanza_IDE.html";const EXTRA="<section id=\"talleres-adicionales-semana2\" aria-label=\"Talleres aplicados de gobernanza\">\n<h2>Talleres aplicados: decisiones verificables de gobernanza</h2>\n<p>Los casos siguientes son <strong>simulaciones docentes</strong>, no registros oficiales. Permiten poner a prueba las distinciones entre productor, custodio, administrador tecnológico, publicador y usuario. En cada caso debe conservarse una evidencia verificable, coherente con el ciclo de vida y la matriz de gobernanza estudiados.</p>\n<h3>Taller 1. Definir responsables y una matriz RACI</h3>\n<p><strong>Escenario.</strong> Una municipalidad mantiene una capa de equipamientos públicos. La unidad territorial produce geometrías, planificación valida contenidos, informática opera PostGIS y GeoServer, y transparencia supervisa las condiciones de difusión. Una actualización cambia la ubicación de tres establecimientos.</p>\n<table><thead><tr><th>Actividad</th><th>Territorial</th><th>Planificación</th><th>Informática</th><th>Transparencia</th></tr></thead><tbody>\n<tr><td>Levantar y corregir geometrías</td><td>R</td><td>A</td><td>I</td><td>C</td></tr>\n<tr><td>Validar calidad y aprobar versión</td><td>R</td><td>A</td><td>C</td><td>I</td></tr>\n<tr><td>Desplegar servicio WMS</td><td>C</td><td>A</td><td>R</td><td>I</td></tr>\n<tr><td>Revisar condiciones de divulgación</td><td>C</td><td>A</td><td>I</td><td>R</td></tr>\n</tbody></table>\n<p><strong>Cómo probarlo.</strong> 1) Copie la matriz a una hoja de cálculo. 2) Identifique si cada actividad tiene exactamente un A. 3) Simule que planificación rechaza la actualización y establezca quién debe corregir y quién puede volver a aprobar. 4) Anote la versión publicada y el acta o ticket de decisión.</p>\n<p><strong>Resultado esperado.</strong> No se confunde ejecutar (R) con responder por la aprobación (A); la versión anterior continúa disponible o queda recuperable hasta completar la validación. <strong>R</strong> ejecuta, <strong>A</strong> asume responsabilidad final, <strong>C</strong> es consultado e <strong>I</strong> informado. Esta matriz es una propuesta pedagógica, no una asignación institucional obligatoria.</p>\n<h3>Taller 2. Simular un proceso de actualización de datos espaciales</h3>\n<p><strong>Escenario.</strong> El conjunto <code>equipamientos_educativos</code> cambia de versión <code>1.0</code> a <code>1.1</code>. Tres coordenadas fueron corregidas y un registro duplicado fue eliminado. El estudiante debe registrar quién solicitó, produjo, validó y publicó la modificación.</p>\n<pre><code>{\n  \"recurso\": \"equipamientos_educativos\",\n  \"version_anterior\": \"1.0\",\n  \"version_nueva\": \"1.1\",\n  \"solicitud\": \"TCK-IDE-024\",\n  \"cambios\": [\"3 geometrías corregidas\", \"1 duplicado eliminado\"],\n  \"productor\": \"Unidad Territorial\",\n  \"custodio\": \"Unidad de Planificación\",\n  \"estado_validacion\": \"pendiente\",\n  \"fecha_publicacion\": null\n}</code></pre>\n<p><strong>Cómo probarlo.</strong> Guarde el ejemplo como <code>registro_cambio.json</code>, ábralo en un editor y verifique que sea JSON válido (por ejemplo, con <code>python -m json.tool registro_cambio.json</code>). Actualice <code>estado_validacion</code> a <code>aprobado</code> solo después de registrar evidencia de calidad; complete fecha y versión de publicación. Compare los dos archivos mediante el control de versiones o una herramienta de diferencias.</p>\n<p><strong>Resultado esperado.</strong> La trazabilidad muestra estado, responsables, cambios y momento de publicación. El JSON es un modelo didáctico de bitácora, no un estándar de metadatos.</p>\n<h3>Taller 3. Distinguir fuente oficial, copia y producto derivado</h3>\n<p><strong>Escenario.</strong> Un departamento mantiene un inventario oficial de plazas en PostGIS. Un analista exporta GeoJSON y un tercero calcula áreas y crea un mapa de accesibilidad. Después se corrige una geometría del inventario.</p>\n<table><thead><tr><th>Recurso</th><th>Clasificación</th><th>Autoridad y acción recomendada</th></tr></thead><tbody>\n<tr><td>Tabla maestra controlada en PostGIS</td><td>Fuente oficial (si así fue designada)</td><td>Custodio aprueba y conserva historial</td></tr>\n<tr><td>GeoJSON exportado para análisis</td><td>Copia de trabajo</td><td>Registrar fecha, versión y origen de exportación</td></tr>\n<tr><td>Mapa de accesibilidad calculado</td><td>Producto derivado</td><td>Documentar parámetros, fecha, insumos y limitaciones</td></tr>\n</tbody></table>\n<p><strong>Cómo probarlo.</strong> Dibuje las tres relaciones de dependencia. Suponga que el polígono de la plaza P-07 cambia un 12 % de superficie. Determine cuáles recursos deben revisarse, quién autoriza la nueva versión y qué advertencia ve el consumidor antes de actualizar el mapa derivado.</p>\n<p><strong>Resultado esperado.</strong> El cambio en una fuente oficial no convierte automáticamente en oficiales sus copias o derivados; estos requieren evaluar obsolescencia, reproducibilidad y sincronización.</p>\n<h3>Taller 4. Diseñar un acuerdo de intercambio mínimo</h3>\n<p><strong>Escenario.</strong> Una unidad regional aporta mensualmente datos de infraestructura a otra organización. Ambas deben definir responsabilidades antes de establecer una API o servicio de mapas.</p>\n<table><thead><tr><th>Campo del acuerdo</th><th>Ejemplo verificable</th></tr></thead><tbody>\n<tr><td>Recurso y alcance</td><td>Inventario de equipamientos, cobertura regional, EPSG:4326</td></tr>\n<tr><td>Responsables</td><td>Productor territorial; custodio de planificación; operador TI</td></tr>\n<tr><td>Frecuencia</td><td>Entrega mensual; aviso de retraso al responsable designado</td></tr>\n<tr><td>Calidad</td><td>Geometrías válidas, identificadores únicos y fecha de actualización</td></tr>\n<tr><td>Condiciones de acceso</td><td>Roles definidos, licencia revisada y datos personales excluidos</td></tr>\n<tr><td>Incidentes y continuidad</td><td>Ticket, contacto, versión recuperable y procedimiento de corrección</td></tr>\n</tbody></table>\n<p><strong>Cómo probarlo.</strong> Transforme los campos en un acuerdo de una página y simule dos incidencias: una entrega fuera de plazo y una capa con identificadores duplicados. Señale el responsable de cada decisión, las evidencias mínimas y el criterio para aceptar una nueva entrega.</p>\n<p><strong>Lista de comprobación final.</strong> Debe quedar definido quién produce, quién custodia, quién autoriza, quién publica, cuál es el recurso oficial, cómo se versiona, cómo se registra una incidencia y cómo se asegura la continuidad institucional.</p>\n</section>\n";(async()=>{const status=document.getElementById('status');try{const r=await fetch(URL,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);let html=await r.text();if(!html.includes('<div class="weeknav">'))throw new Error('No se encontró la navegación original');if(html.includes('talleres-adicionales-semana'))throw new Error('El recurso ya contiene estos talleres');html=html.replace('<div class="weeknav">',EXTRA+'\n<div class="weeknav">');document.open();document.write(html);document.close()}catch(e){status.textContent='No fue posible recuperar el material original desde GitHub: '+e.message+'. Se requiere conexión a Internet. Para uso sin conexión, genera los HTML autónomos con el kit adjunto.'}})();</script></body></html>
